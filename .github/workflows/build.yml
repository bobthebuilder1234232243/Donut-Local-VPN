name: Build IPA

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    build:
        runs-on: macos-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Select Latest Xcode
              run: sudo xcode-select -switch /Applications/Xcode.app

            - name: Build Xcode Archive
              run: |
                  xcodebuild archive \
                    -project DonutLocalVPN.xcodeproj \
                    -scheme DonutLocalVPN \
                    -destination 'generic/platform=iOS' \
                    -archivePath build/DonutLocalVPN.xcarchive \
                    CODE_SIGN_IDENTITY="" \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGNING_ALLOWED=NO

            - name: Create Payload directory
              run: mkdir -p Payload

            - name: Copy App to Payload
              run: cp -R build/DonutLocalVPN.xcarchive/Products/Applications/DonutLocalVPN.app Payload/DonutLocalVPN.app

            - name: Create IPA
              run: |
                  zip -r ./Donut-Local-VPN.ipa Payload

            - name: Upload IPA Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: Donut-Local-VPN-IPA.ipa
                  path: Donut-Local-VPN.ipa
